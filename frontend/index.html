<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analisi semantica del discorso parlamentare italiano — Camera dei Deputati e Senato della Repubblica, XIX legislatura." />
    <title>Analisi del Discorso Parlamentare</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='14' width='5' height='11' fill='%2316181C'/%3E%3Crect x='13.5' y='7' width='5' height='18' fill='%2316181C'/%3E%3Crect x='22' y='11' width='5' height='14' fill='%2316181C'/%3E%3Crect x='4' y='27' width='24' height='1.6' fill='%231F3A5F'/%3E%3C/svg%3E" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='14' width='5' height='11' fill='%23F2F0EC'/%3E%3Crect x='13.5' y='7' width='5' height='18' fill='%23F2F0EC'/%3E%3Crect x='22' y='11' width='5' height='14' fill='%23F2F0EC'/%3E%3Crect x='4' y='27' width='24' height='1.6' fill='%237FA3C9'/%3E%3C/svg%3E" media="(prefers-color-scheme: dark)" />

    <meta name="theme-color" content="#F7F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)" />

    <!--
      No-flash theme stamp. Must run synchronously before first paint so the
      document never renders in the wrong mode. Resolves: explicit user choice
      (localStorage) -> OS preference. `useTheme` reads/writes the same key.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('psa-theme');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
