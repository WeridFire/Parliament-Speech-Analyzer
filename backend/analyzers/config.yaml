# Analyzer Configuration
# ======================
# Control which analyzers and features are enabled.
# Set enabled: false to skip an analyzer entirely.
# Set features.X: false to skip specific sub-features.

# Identity Analyzer - What each group talks about
identity:
  enabled: true
  features:
    topic_profile: true          # Share of speeches per topic, and lift over the chamber
    generalism_index: true       # Entropy-based specialization score
    distinctive_keywords: true   # Log-odds distinctive terms per party

# Topics Analyzer - Who carries each topic
topics:
  enabled: true

# Blocs Analyzer - Majority (with the government) vs opposition
blocs:
  enabled: true
  features:
    summary: true                # Volume and length of interventions per bloc
    ownership: true              # Which bloc devotes more attention to each topic
    keywords: true               # Words that separate the two sides

# Relations Analyzer - Party relationships (centred embeddings)
relations:
  enabled: true
  features:
    affinity_matrix: true        # Party similarity heatmap
    party_cohesion: true         # Homogeneity of each group's speeches
    cross_party_pairs: true      # Similar speakers from different parties

# Reactions Analyzer - Applause and protests from the stage directions
reactions:
  enabled: true

# Mentions Analyzer - Which groups name which public figures
mentions:
  enabled: true

# Temporal Analyzer - Evolution over time (global only)
temporal:
  enabled: true
  granularity: month             # 'month' or 'week'
  features:
    topic_trends: true           # Monthly topic shares and bloc activity

# Speaker Analyzer - Per-politician statistics
speaker:
  enabled: true
  features:
    profile: true                # Activity, verbosity, linguistic rates, topics, reactions
    vocabulary: true             # Lexical richness (MATTR)

# Language Analyzer - Readability and polarization
language:
  enabled: true
  features:
    readability: true            # Gulpease index
    polarization: true           # "Us vs Them" marker density
